name: cadmus-dictionary-studio

services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${CADMUS_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s

  minio:
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${CADMUS_OBJECT_STORAGE_ACCESS_KEY:-cadmus-local-access}
      MINIO_ROOT_PASSWORD: ${CADMUS_OBJECT_STORAGE_SECRET_KEY:-cadmus-local-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${CADMUS_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${CADMUS_MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:9000/minio/health/ready
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  object-storage-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - python
      - -m
      - cadmus.infrastructure.initialize_object_storage
    environment: &object-storage-environment
      CADMUS_OBJECT_STORAGE_ENDPOINT: minio:9000
      CADMUS_OBJECT_STORAGE_ACCESS_KEY: ${CADMUS_OBJECT_STORAGE_ACCESS_KEY:-cadmus-local-access}
      CADMUS_OBJECT_STORAGE_SECRET_KEY: ${CADMUS_OBJECT_STORAGE_SECRET_KEY:-cadmus-local-secret}
      CADMUS_OBJECT_STORAGE_BUCKET: ${CADMUS_OBJECT_STORAGE_BUCKET:-cadmus}
      CADMUS_OBJECT_STORAGE_SECURE: "false"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cadmus
    restart: "no"

  redis:
    image: redis:7.2.15-bookworm
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${CADMUS_DATABASE_NAME:-cadmus}
      POSTGRES_USER: ${CADMUS_DATABASE_USER:-cadmus}
      POSTGRES_PASSWORD: ${CADMUS_DATABASE_PASSWORD:-cadmus-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CADMUS_POSTGRES_PORT:-5432}:5432"
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - alembic
      - upgrade
      - head
    environment: &database-environment
      CADMUS_DATABASE_NAME: ${CADMUS_DATABASE_NAME:-cadmus}
      CADMUS_DATABASE_USER: ${CADMUS_DATABASE_USER:-cadmus}
      CADMUS_DATABASE_PASSWORD: ${CADMUS_DATABASE_PASSWORD:-cadmus-local}
      CADMUS_DATABASE_HOST: postgres
      CADMUS_DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cadmus
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CADMUS_ENVIRONMENT: ${CADMUS_ENVIRONMENT:-development}
      CADMUS_NAME: ${CADMUS_NAME:-cadmus-api}
      CADMUS_VERSION: ${CADMUS_VERSION:-0.1.0}
      CADMUS_PUBLIC_WEB_URL: http://localhost:${CADMUS_WEB_PORT:-5173}
      CADMUS_SMTP_HOST: mailpit
      CADMUS_SMTP_PORT: 1025
      CADMUS_EMAIL_FROM: Cadmus <noreply@cadmus.local>
      CADMUS_SESSION_LIFETIME_HOURS: ${CADMUS_SESSION_LIFETIME_HOURS:-12}
      CADMUS_MAX_UPLOAD_SIZE_BYTES: ${CADMUS_MAX_UPLOAD_SIZE_BYTES:-104857600}
      CADMUS_REDIS_HOST: redis
      CADMUS_REDIS_PORT: 6379
      CADMUS_REDIS_BROKER_DATABASE: ${CADMUS_REDIS_BROKER_DATABASE:-0}
      CADMUS_REDIS_RESULT_DATABASE: ${CADMUS_REDIS_RESULT_DATABASE:-1}
      CADMUS_GOOGLE_OAUTH_CLIENT_ID: ${CADMUS_GOOGLE_OAUTH_CLIENT_ID:-}
      CADMUS_GOOGLE_OAUTH_CLIENT_SECRET: ${CADMUS_GOOGLE_OAUTH_CLIENT_SECRET:-}
      CADMUS_GOOGLE_OAUTH_REDIRECT_URL: ${CADMUS_GOOGLE_OAUTH_REDIRECT_URL:-}
      <<: [*database-environment, *object-storage-environment]
    depends_on:
      mailpit:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:${CADMUS_API_PORT:-8000}:8000"
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    environment:
      CADMUS_API_UPSTREAM: api:8000
      CADMUS_MAX_UPLOAD_SIZE_MB: ${CADMUS_MAX_UPLOAD_SIZE_MB:-100}
    depends_on:
      api:
        condition: service_healthy
    init: true
    ports:
      - "${CADMUS_WEB_PORT:-5173}:8080"
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - celery
      - --app
      - cadmus_worker.celery_app:celery_app
      - worker
      - --loglevel
      - INFO
    environment:
      CADMUS_ENVIRONMENT: ${CADMUS_ENVIRONMENT:-development}
      CADMUS_REDIS_HOST: redis
      CADMUS_REDIS_PORT: 6379
      CADMUS_REDIS_BROKER_DATABASE: ${CADMUS_REDIS_BROKER_DATABASE:-0}
      CADMUS_REDIS_RESULT_DATABASE: ${CADMUS_REDIS_RESULT_DATABASE:-1}
      <<: [*database-environment, *object-storage-environment]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery --app cadmus_worker.celery_app:celery_app inspect ping
          --destination "celery@$${HOSTNAME}" --timeout 2
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

  postgres-test:
    profiles:
      - test
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: cadmus_test
      POSTGRES_USER: cadmus_test
      POSTGRES_PASSWORD: cadmus-test-only
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cadmus_test -d cadmus_test
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  minio-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: cadmus-test-access
      MINIO_ROOT_PASSWORD: cadmus-test-secret
    tmpfs:
      - /data
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:9000/minio/health/ready
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mailpit-test:
    profiles:
      - test
    image: axllent/mailpit:v1.30.0
    networks:
      - cadmus
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  object-storage-test-init:
    profiles:
      - test
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - python
      - -m
      - cadmus.infrastructure.initialize_object_storage
    environment: &test-object-storage-environment
      CADMUS_OBJECT_STORAGE_ENDPOINT: minio-test:9000
      CADMUS_OBJECT_STORAGE_ACCESS_KEY: cadmus-test-access
      CADMUS_OBJECT_STORAGE_SECRET_KEY: cadmus-test-secret
      CADMUS_OBJECT_STORAGE_BUCKET: cadmus-test
      CADMUS_OBJECT_STORAGE_SECURE: "false"
    depends_on:
      minio-test:
        condition: service_healthy
    networks:
      - cadmus
    restart: "no"

  integration-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    command:
      - pytest
      - -p
      - no:cacheprovider
      - -m
      - integration
      - tests/integration
    environment:
      CADMUS_ENVIRONMENT: test
      CADMUS_TEST_SMTP_HOST: mailpit-test
      CADMUS_TEST_MAILPIT_URL: http://mailpit-test:8025
      <<: *test-object-storage-environment
      CADMUS_TEST_DATABASE_URL: >-
        postgresql+psycopg://cadmus_test:cadmus-test-only@postgres-test:5432/cadmus_test
    depends_on:
      mailpit-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      object-storage-test-init:
        condition: service_completed_successfully
    networks:
      - cadmus

networks:
  cadmus:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  redis-data:
