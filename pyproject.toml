[dependency-groups]
dev = [
    "httpx2>=2.10.0,<2.11.0",
    "mypy>=2.3.0,<2.4.0",
    "pytest>=9.1.1,<9.2.0",
    "ruff>=0.16.3,<0.17.0",
]

[tool.uv]
required-version = ">=0.12.3,<0.13.0"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/backend"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/backend/tests"]
markers = [
    "integration: requires the isolated PostgreSQL service from Compose",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true
