name: cadmus-dev

x-notification-environment: &notification-environment
  CADMUS_SMTP_HOST: mailpit
  CADMUS_SMTP_PORT: 1025
  CADMUS_SMTP_USERNAME: ""
  CADMUS_SMTP_PASSWORD: ""
  CADMUS_SMTP_USE_TLS: "false"
  CADMUS_EMAIL_FROM: "Cadmus Dev <noreply@cadmus.local>"
  CADMUS_TELEGRAM_BOT_TOKEN: ${CADMUS_TELEGRAM_BOT_TOKEN:-}

services:
  migrate-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - alembic
      - upgrade
      - head
    environment: &database-environment
      CADMUS_DATABASE_NAME: cadmus_dev
      CADMUS_DATABASE_USER: ${CADMUS_DATABASE_USER:-cadmus}
      CADMUS_DATABASE_PASSWORD: ${CADMUS_DATABASE_PASSWORD:-cadmus-local}
      CADMUS_DATABASE_HOST: postgres
      CADMUS_DATABASE_PORT: 5432
    networks:
      - cadmus-shared
    restart: "no"

  object-storage-init-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - python
      - -m
      - cadmus.infrastructure.initialize_object_storage
    environment: &object-storage-environment
      CADMUS_OBJECT_STORAGE_ENDPOINT: minio:9000
      CADMUS_OBJECT_STORAGE_ACCESS_KEY: ${CADMUS_OBJECT_STORAGE_ACCESS_KEY:-cadmus-local-access}
      CADMUS_OBJECT_STORAGE_SECRET_KEY: ${CADMUS_OBJECT_STORAGE_SECRET_KEY:-cadmus-local-secret}
      CADMUS_OBJECT_STORAGE_BUCKET: ${CADMUS_OBJECT_STORAGE_BUCKET:-cadmus}
      CADMUS_OBJECT_STORAGE_SECURE: "false"
    networks:
      - cadmus-shared
    restart: "no"

  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CADMUS_ENVIRONMENT: staging
      CADMUS_NAME: cadmus-api-dev
      CADMUS_VERSION: ${CADMUS_VERSION:-0.1.0}
      CADMUS_PUBLIC_WEB_URL: https://dev.cds.in.ua
      CADMUS_SESSION_LIFETIME_HOURS: ${CADMUS_SESSION_LIFETIME_HOURS:-12}
      CADMUS_MAX_UPLOAD_SIZE_BYTES: ${CADMUS_MAX_UPLOAD_SIZE_BYTES:-104857600}
      CADMUS_REDIS_HOST: redis
      CADMUS_REDIS_PORT: 6379
      CADMUS_REDIS_BROKER_DATABASE: 2
      CADMUS_REDIS_RESULT_DATABASE: 3
      CADMUS_GOOGLE_OAUTH_CLIENT_ID: ${CADMUS_GOOGLE_OAUTH_CLIENT_ID:-}
      CADMUS_GOOGLE_OAUTH_CLIENT_SECRET: ${CADMUS_GOOGLE_OAUTH_CLIENT_SECRET:-}
      CADMUS_GOOGLE_OAUTH_REDIRECT_URL: https://dev.cds.in.ua/api/auth/google/callback
      <<: [*database-environment, *object-storage-environment, *notification-environment]
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      object-storage-init-dev:
        condition: service_completed_successfully
    init: true
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - cadmus-shared
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    environment:
      CADMUS_API_UPSTREAM: api-dev:8000
      CADMUS_MAX_UPLOAD_SIZE_MB: ${CADMUS_MAX_UPLOAD_SIZE_MB:-100}
    depends_on:
      api-dev:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:5183:8080"
    networks:
      - cadmus-shared
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  worker-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command:
      - celery
      - --app
      - cadmus_worker.celery_app:celery_app
      - worker
      - --loglevel
      - INFO
    environment:
      CADMUS_ENVIRONMENT: staging
      CADMUS_REDIS_HOST: redis
      CADMUS_REDIS_PORT: 6379
      CADMUS_REDIS_BROKER_DATABASE: 2
      CADMUS_REDIS_RESULT_DATABASE: 3
      <<: [*database-environment, *object-storage-environment, *notification-environment]
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
      object-storage-init-dev:
        condition: service_completed_successfully
    init: true
    networks:
      - cadmus-shared
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery --app cadmus_worker.celery_app:celery_app inspect ping
          --destination "celery@$${HOSTNAME}" --timeout 2
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

networks:
  cadmus-shared:
    external: true
    name: cadmus-dictionary-studio_cadmus
