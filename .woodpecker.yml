when:
  - event: pull_request
  - event: push
    branch: [main, dev]

steps:
  verify:
    image: python:3.12-slim-bookworm
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl unzip ca-certificates make > /dev/null
      - pip install --quiet uv==0.12.3
      - curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
      - export PATH="$HOME/.bun/bin:$PATH"
      - make install
      - make verify
