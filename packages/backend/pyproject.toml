[project]
name = "cadmus-backend"
version = "0.1.0"
description = "Shared application and domain package for Cadmus Dictionary Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.5,<1.17.0",
    "authlib>=1.7.2,<1.8.0",
    "celery[redis]>=5.6.3,<5.7.0",
    "httpx>=0.28,<0.29",
    "minio>=7.2.20,<7.3.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.10,<3.3.0",
    "pydantic-settings>=2.14.2,<2.15.0",
    "pypdf>=6.1.3,<6.2.0",
    "pypdfium2>=5.13.0",
    "sqlalchemy>=2.0.43,<2.1.0",
]

[build-system]
requires = ["uv-build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cadmus"
module-root = "src"
